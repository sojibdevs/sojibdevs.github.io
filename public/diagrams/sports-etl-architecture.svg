<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Segoe UI, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker></defs><text x="20" y="28" font-size="15" font-weight="700" fill="#2dd4bf">Sports data service: from provider feed to published event</text><rect x="20" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="100.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Data providers</text><text x="100.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">SportsDataIO · Roanuz</text><rect x="215" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="295.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Ingestion workers</text><text x="295.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">scheduled hosted</text><text x="295.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">services</text><rect x="410" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="490.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Use cases</text><text x="490.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">reference data, box scores,</text><text x="490.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">projections, headshots</text><rect x="605" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="685.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Data access</text><text x="685.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">Dapper · SqlBulkCopy</text><text x="685.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">staging table + MERGE</text><rect x="800" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.6"/><text x="880.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">SQL Server</text><text x="880.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">domain tables</text><text x="880.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">+ OutboxEvents</text><path d="M180 97.0 L212 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M375 97.0 L407 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M570 97.0 L602 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M765 97.0 L797 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="800" y="250" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="880.0" y="283.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Outbox publisher</text><text x="880.0" y="301.0" text-anchor="middle" font-size="11" fill="#94a3b8">hosted service</text><rect x="605" y="250" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="685.0" y="283.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">RabbitMQ</text><text x="685.0" y="301.0" text-anchor="middle" font-size="11" fill="#94a3b8">EasyNetQ</text><rect x="410" y="250" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="490.0" y="283.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Typed consumers</text><text x="490.0" y="301.0" text-anchor="middle" font-size="11" fill="#94a3b8">EasyNetQ AutoSubscribe</text><text x="490.0" y="315.0" text-anchor="middle" font-size="11" fill="#94a3b8">(fantasy platform)</text><path d="M880 134 L880 247" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><text x="870" y="175" text-anchor="end" font-size="11" fill="#2dd4bf">written in the same transaction as game data</text><path d="M800 287.0 L768 287.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M605 287.0 L573 287.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><text x="960" y="346" text-anchor="end" font-size="11" fill="#94a3b8">claims batches with READPAST / UPDLOCK</text><text x="960" y="362" text-anchor="end" font-size="11" fill="#94a3b8">retry with backoff + jitter, resets stuck rows</text><text x="20" y="382" font-size="11" fill="#94a3b8">At-least-once delivery. One service per sport; American football has the outbox relay.</text></svg>