t-size="12" font-weight="600" fill="#e2e8f0">A client upload is published to RabbitMQ, a job consumes it and runs ETL into SQL Server and Azure Storage, and progress streams back over SignalR.</text><text x="20" y="452" text-anchor="start" font-size="10" font-weight="400" fill="#64748b">Shows the six deployed components. The repository also holds Xero and monitoring jobs.</text></svg>