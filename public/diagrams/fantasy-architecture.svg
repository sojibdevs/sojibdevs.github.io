<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker></defs><text x="20" y="28" font-size="15" font-weight="700" fill="#2dd4bf">Fantasy platform: event to leaderboard update</text><rect x="20" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="100.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">RabbitMQ events</text><text x="100.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">match updated</text><text x="100.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">match final</text><rect x="215" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="295.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Leaderboard worker</text><text x="295.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">EasyNetQ AutoSubscribe</text><rect x="410" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="490.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Checkpoint</text><text x="490.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">skip duplicate or</text><text x="490.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">older events</text><rect x="605" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.6"/><text x="685.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">One transaction</text><text x="685.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">points, team totals,</text><text x="685.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">match final, tournament</text><rect x="800" y="60" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="880.0" y="93.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Operator database</text><text x="880.0" y="111.0" text-anchor="middle" font-size="11" fill="#94a3b8">one per white-label</text><text x="880.0" y="125.0" text-anchor="middle" font-size="11" fill="#94a3b8">operator</text><path d="M180 97.0 L212 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M375 97.0 L407 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M570 97.0 L602 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M765 97.0 L797 97.0" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="410" y="220" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="490.0" y="253.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Polling fallback</text><text x="490.0" y="271.0" text-anchor="middle" font-size="11" fill="#94a3b8">finds matches with</text><text x="490.0" y="285.0" text-anchor="middle" font-size="11" fill="#94a3b8">pending updates</text><path d="M490 220 L490 137" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><text x="498" y="185" font-size="11" fill="#2dd4bf">missed events</text><rect x="605" y="220" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="685.0" y="253.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Contest creation</text><text x="685.0" y="271.0" text-anchor="middle" font-size="11" fill="#94a3b8">daily scheduled worker</text><path d="M765 257.0 L870 257.0 L870 137" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="605" y="335" width="160" height="74" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="685.0" y="368.0" text-anchor="middle" font-size="13" font-we