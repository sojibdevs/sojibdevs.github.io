<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="700" fill="#2dd4bf">Reference architecture: projects, layers and one request</text><text x="20" y="56" text-anchor="start" font-size="11" font-weight="600" fill="#94a3b8">LAYERS (DEPENDENCIES POINT INWARD, TO CORE)</text><rect x="20" y="68" width="215" height="64" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="127.5" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Presentation.Api</text><text x="127.5" y="103.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">controllers, middleware,</text><text x="127.5" y="117.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">MOC module</text><rect x="255" y="68" width="215" height="64" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="362.5" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Workers.Synchronizer</text><text x="362.5" y="110.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">background worker host</text><rect x="20" y="162" width="215" height="64" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="127.5" y="180.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Application.ApiServices</text><text x="127.5" y="197.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">sign-in, equipment,</text><text x="127.5" y="211.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">dropdown use cases</text><rect x="255" y="162" width="215" height="64" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="362.5" y="187.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Application.Synchronizer</text><text x="362.5" y="204.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">synchronizer job service</text><rect x="20" y="256" width="450" height="72" rx="8" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.6"/><text x="245.0" y="278.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Core</text><text x="245.0" y="295.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">Domain (entities, repository interfaces, list-view DTOs)</text><text x="245.0" y="309.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">Abstractions (service interfaces)  ·  Shared (exceptions, validation)</text><rect x="20" y="358" width="450" height="72" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="245.0" y="380.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Infrastructure</text><text x="245.0" y="397.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">DataAccess (EF Core, repositories, list-view builder)</text><text x="245.0" y="411.0" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">Shared (tenant connections, AES, hashing)  ·  Integrations (stubs)</text><path d="M127 132 L127 160" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M362 132 L362 160" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M127 226 L127 254" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M362 226 L362 254" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><path d="M245 358 L245 330" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><text x="245" y="445" text-anchor="middle" font-size="10" font-weight="400" fill="#64748b">Presentation.Api wires Infrastructure at startup (composition root)</text><text x="520" y="56" text-anchor="start" font-size="11" font-weight="600" fill="#94a3b8">ONE REQUEST, STEP BY STEP</text><rect x="520" y="68" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="534" y="87" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">1  Sign-in</text><text x="534" y="104" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">the client name goes into the JWT as a claim</text><path d="M740 114 L740 128" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="128" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="534" y="147" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">2  Controller</text><text x="534" y="164" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">calls an Application.ApiServices use case</text><path d="M740 174 L740 188" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="188" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="534" y="207" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">3  Current-user context</text><text x="534" y="224" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">reads the client claim from the request</text><path d="M740 234 L740 248" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="248" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="534" y="267" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">4  Tenant connection factory</text><text x="534" y="284" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">looks up the client in the common DB, AES-decrypts its credentials</text><path d="M740 294 L740 308" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="308" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#27465a" stroke-width="1"/><text x="534" y="327" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">5  Data access</text><text x="534" y="344" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">EF Core writes with audit rows; Dapper list-view CTE reads</text><path d="M740 354 L740 368" fill="none" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="368" width="440" height="46" rx="8" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.6"/><text x="534" y="387" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">6  Tenant database</text><text x="534" y="404" text-anchor="start" font-size="11" font-weight="400" fill="#94a3b8">SQL Server, one per client</text><rect x="20" y="460" width="940" height="34" rx="8" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="5 4"/><text x="490" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Architecture tests (NetArchTest, MSTest): 8 rules in CI. A wrong-way layer dependency fails the build.</text><text x="20" y="512" text-anchor="start" font-size="10" font-weight="400" fill="#64748b">Reference implementation (10 source and 11 test projects), not a production system. Cache and event-bus adapters are stubs.</text></svg>